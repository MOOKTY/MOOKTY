<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Okasha portrait with animated cyan glow</title>
  <desc id="desc">A professional portrait framed by subtle animated blue and cyan rings.</desc>
  <defs>
    <radialGradient id="backdrop" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#10263b"/>
      <stop offset="0.72" stop-color="#07111d"/>
      <stop offset="1" stop-color="#03070d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.45" stop-color="#178bff"/>
      <stop offset="1" stop-color="#45f3ff"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="portraitClip"><circle cx="180" cy="180" r="137"/></clipPath>
  </defs>

  <circle cx="180" cy="180" r="176" fill="url(#backdrop)"/>
  <circle cx="180" cy="180" r="157" fill="none" stroke="#00d9ff" stroke-width="2" opacity="0.22" filter="url(#glow)">
    <animate attributeName="r" values="153;160;153" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.16;0.42;0.16" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="149" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="62 24 18 34" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 180 180" to="360 180 180" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="180" r="143" fill="#050b12" stroke="#4be8ff" stroke-width="1.5" opacity="0.95"/>
  <image x="43" y="43" width="274" height="274" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)" href="https://raw.githubusercontent.com/MOOKTY/MOOKTY/main/assets/profile/portrait.jpg" xlink:href="https://raw.githubusercontent.com/MOOKTY/MOOKTY/main/assets/profile/portrait.jpg"/>
  <circle cx="180" cy="180" r="137" fill="none" stroke="#8af7ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="180" cy="180" r="167" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="3 14" opacity="0.42">
    <animateTransform attributeName="transform" type="rotate" from="360 180 180" to="0 180 180" dur="24s" repeatCount="indefinite"/>
  </circle>
</svg>
