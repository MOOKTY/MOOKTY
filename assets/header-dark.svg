<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Mohammad Okasha cybersecurity profile header</title><desc id="desc">Dark terminal-inspired banner with subtle animated scan line.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b10"/><stop offset="1" stop-color="#0d1720"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#38f2b0"/><stop offset="1" stop-color="#45caff"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#6ce5ff" stroke-opacity=".055"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="330" rx="22" fill="url(#bg)"/><rect width="1200" height="330" rx="22" fill="url(#grid)"/><path d="M0 1h1200M0 329h1200" stroke="url(#accent)" stroke-opacity=".6"/><g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><text x="70" y="83" fill="#7b8997" font-size="18">root@profile:~$ whoami</text><text x="70" y="151" fill="#f2f7fa" font-size="48" font-weight="700" letter-spacing="1">Mohammad Okasha</text><text x="70" y="201" fill="url(#accent)" font-size="23" filter="url(#glow)">CYBERSECURITY STUDENT // CTF PLAYER</text><text x="70" y="240" fill="#aab7c3" font-size="19">PWN Challenge Author · Security Tools Developer</text><text x="70" y="285" fill="#38f2b0" font-size="18">status: probing assumptions_</text></g><g transform="translate(980 164)" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".78"><path d="M0-91 79-46v92L0 91-79 46v-92Z"/><path d="m-35-15 35-21 35 21v41L0 47l-35-21Z" opacity=".55"/><path d="M-21 2 0 21 27-10" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="0" y="0" width="1200" height="2" fill="#45caff" opacity=".18"><animate attributeName="y" values="0;328;0" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.22;0" dur="9s" repeatCount="indefinite"/></rect></svg>
